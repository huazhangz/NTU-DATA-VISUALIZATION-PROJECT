<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="410" viewBox="0 0 1060 410" role="img" aria-labelledby="title desc">
<title id="title">Typical county ranges differ across the three measures</title>
<desc id="desc">Whisker = 5th–95th percentile; box = 25th–75th percentile; dot = median. Counties have equal visual weight.</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#5C667A}.panel{font-size:15px;font-weight:700}.axis{font-size:11px;fill:#5C667A}.value{font-size:12px;font-weight:700}.note{font-size:11px;fill:#5C667A}.grid{stroke:#E5E9F0;stroke-width:1}.frame{fill:none;stroke:#AAB2C0;stroke-width:1}</style>
<text x="60" y="42" class="title">Typical county ranges differ across the three measures</text>
<text x="60" y="66" class="subtitle">Whisker = 5th–95th percentile; box = 25th–75th percentile; dot = median. Counties have equal visual weight.</text>
