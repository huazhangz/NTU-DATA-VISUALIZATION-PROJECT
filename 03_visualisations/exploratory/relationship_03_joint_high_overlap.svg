<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
<title id="title">Upper-quartile burden frequently overlaps</title>
<desc id="desc">Count of counties above the metric-specific 75th percentile on exactly zero, one, two, or all three measures.</desc>
